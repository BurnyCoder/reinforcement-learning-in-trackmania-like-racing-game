# Hugging Face card clips: one clip for each published model that has no README clip (docs/videos/clips.yaml),
# recorded by scripts/11_record_videos.py --clips docs/videos/cards/clips.yaml --out docs/videos/cards --no-readme --no-gif.
# Same fields as docs/videos/clips.yaml. Specialists show their own training track (fixed track); models trained on
# generated tracks show their best official campaign lap (rule best), a track none of them trained on.
clips:
- title: Best lap of the second generalist seed
  replay: generalist-seed1
  run: generalist/seed1
  split: campaign
  rule: best
  explain: 'The generalist of seed 1, trained by reinforcement learning on generated tracks only, as in the preregistered
    recipe. This hand-made track was never part of its training, so the lap is generalization: it reads the road ahead and
    picks a speed for each bend.'
- title: Best lap of the blind control
  replay: blind-seed1
  run: blind/seed1
  split: campaign
  rule: best
  explain: 'The blind control: the same training as the generalist, but its observation keeps only the nearest centreline
    point, so it cannot see the road ahead. The track was never part of its training; compare its lap with the generalist''s,
    which sees the road ahead (hypothesis H3).'
- title: Best lap of the PQN baseline
  replay: pqn-seed1
  run: pqn/seed1
  split: campaign
  rule: best
  explain: The baseline algorithm, PQN (parallelised Q-learning), trained with the same inputs, actions, reward and step budget
    as the PPO generalist on generated tracks. The track was never part of its training.
- title: Best lap of the single-track ablation
  replay: size-1-seed1
  run: size-1/seed1
  split: campaign
  rule: best
  explain: 'The training-set-size ablation with one track: the standard recipe trained on a single generated track from the
    pool. The hand-made track was never part of its training; the results compare how far one training track generalizes against
    the full pool (hypothesis H2).'
- title: Specialist on its own track (campaign-02)
  replay: specialist-campaign-02-seed1
  run: specialist-campaign-02/seed1
  split: campaign
  track: campaign-02
  explain: A specialist trained by reinforcement learning from scratch on this one hand-made track only. Its lap shows what
    it learned on its own track; the results show how it does on tracks it never saw.
