# README video clips, recorded by scripts/11_record_videos.py with the browser game's "Watch replay" mode.
# Every clip replays an official evaluation run: the car states the Python evaluator recorded while scoring
# the run (a ghost in web/assets/ghosts/<track>/<replay>.json), so the clip is exactly the run its label
# describes, failures included. Each clip names the ghost (replay), the run whose official evaluation it
# comes from (run), the set (split), and either a fixed track or a selection rule over that evaluation
# (racingmania.eval.clips: best, median_jump, mid_fail; rule_run: read the rule from another run's evaluation;
# variant: only out-of-range tracks of that variant),
# so the README shows labelled best, typical and failure cases rather than hand-picked ones.
# until: finish (default) records to the finish line; out stops where an unfinished run ended.
clips:
  - title: Best specialist lap
    replay: specialist-campaign-01-seed0
    run: specialist-campaign-01/seed0
    split: campaign
    rule: best
  - title: Best generalist lap on a hand-made track it never saw in training
    replay: generalist-seed0
    run: generalist/seed0
    split: campaign
    rule: best
  - title: "Best generalist lap on a held-out generated track it never saw in training: it generalized"
    replay: generalist-seed0
    run: generalist/seed0
    split: test
    rule: best
  - title: Scripted driver on the same held-out track, for comparison
    replay: scripted-driver
    run: baselines/scripted/seed0
    split: test
    rule: best
    rule_run: generalist/seed0   # the same track as the clip before
  - title: Typical generalist lap on a held-out generated track it never saw in training
    replay: generalist-seed0
    run: generalist/seed0
    split: test
    rule: median_jump
  - title: "Generalization failure on a held-out track: the generalist falls off halfway round"
    replay: generalist-seed0
    run: generalist/seed0
    split: test
    rule: mid_fail
    until: out
  - title: "Generalization failure beyond the training range: a corner tighter than any training track"
    replay: generalist-seed0
    run: generalist/seed0
    split: oor
    variant: tight_turns        # out-of-range tracks with tighter turns than training, where it fails most often
    rule: mid_fail
    until: out
  - title: Untrained network (control) on the specialist's track
    replay: untrained-seed0
    run: baselines/untrained/seed0
    split: campaign
    track: campaign-01
    until: out
    note: >-
      Like every evaluated driver, the network takes its most probable action at each step instead of sampling one. With
      random initial weights its output layer starts close to zero (standard deviation 0.01, the CleanRL convention), so it
      picks almost the same keys every step, here steering right while coasting, and never presses gas. Sampled instead of
      taken greedily, the same network would press keys almost uniformly at random, which is how PPO starts exploring.
  - title: "Untrained network with sampled actions: almost uniformly random keys, as PPO starts exploring"
    replay: untrained-seed0-sampled
    run: demos/untrained-sampled/seed0     # scripts/13_sampled_untrained_demo.py; not part of the scored evaluation
    split: campaign
    track: campaign-01
    until: out
    compare: demos/random-vs-sampled/campaign-01.json   # scripts/14_random_vs_sampled.py
    compare_as: untrained_sampled
    note: >-
      The same network and weights as the clip before. The official evaluation takes the most probable action; here the
      keys of every step are drawn from the network's own probabilities, which are close to one in three for each steering
      and each pedal choice, so they are almost uniformly random, as at the start of PPO training. The car jitters between
      gas, coast and brake and drifts a few dozen metres before it is out for lack of progress. This is a demonstration
      run, not part of the scored evaluation.
  - title: Random actions (control) on the specialist's track
    replay: random-seed0
    run: baselines/random/seed0
    split: campaign
    track: campaign-01
    until: out
    compare: demos/random-vs-sampled/campaign-01.json
    compare_as: random_actions
    note: >-
      This control presses a uniformly random key combination every agent step (0.05 s). Gas, coast and brake, which
      reverses at a standstill, each come up a third of the time and cancel out, so the car makes almost no progress and is
      out under the "no 0.5 m of progress in 2 s" rule.
